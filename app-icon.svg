<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E5C8A"/>
      <stop offset="1" stop-color="#0A3D5C"/>
    </linearGradient>
    <linearGradient id="zone" x1="120" y1="110" x2="400" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB347"/>
      <stop offset="1" stop-color="#F08A24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.65">
      <stop stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded-square sea background -->
  <rect width="512" height="512" rx="104" fill="url(#sea)"/>
  <rect width="512" height="512" rx="104" fill="url(#glow)"/>

  <!-- subtle depth contours -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="3" fill="none">
    <path d="M40 372 C 120 348, 200 396, 288 366 S 452 360, 476 388"/>
    <path d="M40 420 C 130 400, 210 440, 300 414 S 450 410, 476 432"/>
  </g>

  <!-- restricted-zone marker: a dashed managed-area boundary -->
  <circle cx="256" cy="238" r="150" fill="none" stroke="url(#zone)" stroke-width="18"
          stroke-linecap="round" stroke-dasharray="46 30"/>

  <!-- inner protected zone fill -->
  <circle cx="256" cy="238" r="120" fill="#0B4A70" fill-opacity="0.55"/>

  <!-- anchor (the marine subject of the restriction) -->
  <g fill="#F4F8FB">
    <circle cx="256" cy="158" r="20" fill="none" stroke="#F4F8FB" stroke-width="14"/>
    <rect x="247" y="170" width="18" height="150" rx="6"/>
    <rect x="214" y="196" width="84" height="18" rx="9"/>
    <path d="M256 300
             C 210 300, 178 268, 174 224
             l 26 12
             C 206 270, 228 288, 256 288
             C 284 288, 306 270, 312 236
             l 26 -12
             C 334 268, 302 300, 256 300 Z"/>
  </g>

  <!-- prohibition / restriction slash over the anchor -->
  <line x1="182" y1="312" x2="330" y2="164" stroke="#E03030" stroke-width="22" stroke-linecap="round"/>
</svg>
