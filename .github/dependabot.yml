version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Deterministic Angular prefix: dependabot otherwise guesses from repo
    # history (it picked build(deps):), which would dodge the chore(deps):
    # review-skip rule in .coderabbit.yaml.
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @types/node major versions track the Node.js major. The dev baseline
      # is the v22 line (engines allow >=20); ignore v23+ so types never get
      # ahead of the newest supported LTS.
      - dependency-name: "@types/node"
        versions: [">=23"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      actions:
        update-types:
          - minor
          - patch
